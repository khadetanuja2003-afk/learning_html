<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Form Deatils</h1>
    <form>
        <label> First Name</label>
        <input type="text" /> <br> <br>

        <label> Last Name</label>
        <input type="text" /> <br> <br>

        <label> Middle Name</label>
        <input type="text" placeholder="Enter Middle Name" /> <br> <br>

        <label> Mobile number</label>
        <input type="number" placeholder="Enter Mobile Number" /> <br> <br>

        <label> Password</label>
        <input type="password" placeholder="Enter Password" /> <br> <br>

        <label>Choose Cities</label><br>
        <input type="checkbox" checked /> Pune
        <input type="checkbox" checked /> Mumbai
        <input type="checkbox" /> Kolhapur
        <input type="checkbox" /> Nashik
        <input type="checkbox" /> Nagpur

        <br><br>
        <label> Gendar</label><br>
        <input type="radio" name="Gendar" /> Male
        <input type="radio" name="Gendar" /> Female
        <input type="radio" name="Gendar" /> Others<br><br>

        <label> Date and Time</label><br>
        <input type="date" /><br><br>
        <input type="month" /><br><br>
        <input type="week" /><br><br>
        <input type="time" /><br><br>
        <input type="datetime-local" /><br><br>


        <label> Upload Docs</label>
        <input type="file" /><br>

        <label> Upload Docs</label>
        <input type="file" multiple /><br><br>

        <input type="range" /><br><br>
        <input type="color" /><br><br>


        <label> Select Your Fav Sweet Dish</label>
        <select>
            <option>Choose Dish...</option>
            <option>Kaju Katali</option>
            <option>Ladu</option>
            <option>Gulabjamun</option>
            <option>Rasgula</option>
            <option>Rasmali</option>
            <option>Son papdi</option>
            <option>Jilebi</option>
        </select><br><br>

        <textarea rows="10" cols="50"></textarea><br>
        <input type="button" value="Submit" /><br>
        <input type="submit" value="Submit" /><br>
        <input type="reset" value="Reset" /><br>
    </form>
    <hr>
    <fieldset>
        <legend> Contact Form</legend>
        <form>
            <label> Name</label>
            <input type="text" /> <br> <br>
            <label> Email</label>
            <input type="text" /> <br> <br>
            <label> Phone</label>
            <input type="number" /> <br> <br>
            <label> Pincode</label>
            <input type="number" /> <br> <br>
            <label> Address</label>
            <input type="text" /> <br> <br>
        
            <input type="button" value="Submit" /><br>

        </form>
    </fieldset>
</body>

</html>
