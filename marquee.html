<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <marquee scrolldelay="400" bgcolor=yellow>
        <h1> Welcome To pune</h1>
    </marquee>

    <marquee bgcolor=blue direction="right">
        <h1> Welcome To pune</h1>
    </marquee>

    <marquee scrollamount="30" bgcolor=red direction="right" behavior="alternate">
        <h1> Welcome To pune</h1>
    </marquee>

    <marquee bgcolor=pink direction="down" height="100px">
        <h1> Welcome To pune</h1>
    </marquee>

    <marquee bgcolor=green direction="up" height="200px">
        <h1> Welcome To pune</h1>
    </marquee>


</body>

</html>
